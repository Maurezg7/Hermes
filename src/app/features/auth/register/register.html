<div id="cont_register">
  <div class="cont_msg">
    <div id="cont_img">
      <img src="/banners/Logo_Hermes.png" alt="">
      <h1>ermes</h1>
    </div>
    <p>Comparte tus ideas con el mundo y sientete libre de tener tu espacio para hablar de lo que mas te gusta.</p>
  </div>
  <form action="" (ngSubmit)="onSumbit()">
    <h1>UNETE</h1>
    <div class="cont_input">
      <input type="text" placeholder="Nombre de usuario" id="username" name="username" [(ngModel)]="user.username">
      <div class="view_input">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill"
          viewBox="0 0 16 16">
          <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6" />
        </svg>
      </div>
    </div>
    <div class="cont_input">
      <input type="email" placeholder="Email" id="email" name="email" [(ngModel)]="user.email">
      <div class="view_input">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
          class="bi bi-envelope-at-fill" viewBox="0 0 16 16">
          <path
            d="M2 2A2 2 0 0 0 .05 3.555L8 8.414l7.95-4.859A2 2 0 0 0 14 2zm-2 9.8V4.698l5.803 3.546zm6.761-2.97-6.57 4.026A2 2 0 0 0 2 14h6.256A4.5 4.5 0 0 1 8 12.5a4.49 4.49 0 0 1 1.606-3.446l-.367-.225L8 9.586zM16 9.671V4.697l-5.803 3.546.338.208A4.5 4.5 0 0 1 12.5 8c1.414 0 2.675.652 3.5 1.671" />
          <path
            d="M15.834 12.244c0 1.168-.577 2.025-1.587 2.025-.503 0-1.002-.228-1.12-.648h-.043c-.118.416-.543.643-1.015.643-.77 0-1.259-.542-1.259-1.434v-.529c0-.844.481-1.4 1.26-1.4.585 0 .87.333.953.63h.03v-.568h.905v2.19c0 .272.18.42.411.42.315 0 .639-.415.639-1.39v-.118c0-1.277-.95-2.326-2.484-2.326h-.04c-1.582 0-2.64 1.067-2.64 2.724v.157c0 1.867 1.237 2.654 2.57 2.654h.045c.507 0 .935-.07 1.18-.18v.731c-.219.1-.643.175-1.237.175h-.044C10.438 16 9 14.82 9 12.646v-.214C9 10.36 10.421 9 12.485 9h.035c2.12 0 3.314 1.43 3.314 3.034zm-4.04.21v.227c0 .586.227.8.581.8.31 0 .564-.17.564-.743v-.367c0-.516-.275-.708-.572-.708-.346 0-.573.245-.573.791" />
        </svg>
      </div>
    </div>
    <div class="cont_input">
      <input type="{{typeLocked}}" placeholder="Contraseña" id="password" name="password" [(ngModel)]="user.password">
      <button class="view_input" (click)="miFuncion($event)">
        @if (isLocked) {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock-fill"
          viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3" />
        </svg>
        }@else {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-unlock-fill"
          viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M12 0a4 4 0 0 1 4 4v2.5h-1V4a3 3 0 1 0-6 0v2h.5A2.5 2.5 0 0 1 12 8.5v5A2.5 2.5 0 0 1 9.5 16h-7A2.5 2.5 0 0 1 0 13.5v-5A2.5 2.5 0 0 1 2.5 6H8V4a4 4 0 0 1 4-4" />
        </svg>
        }
      </button>
    </div>
    <div class="cont_input">
      <input type="{{typeLocked}}" placeholder="Repetir contraseña" id="passwordConfirm" name="confirmPassword"
        [(ngModel)]="confirmPassword">
      <button class="view_input" (click)="miFuncion($event)" type="submit">
        @if (isLocked) {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock-fill"
          viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3" />
        </svg>
        }@else {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-unlock-fill"
          viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M12 0a4 4 0 0 1 4 4v2.5h-1V4a3 3 0 1 0-6 0v2h.5A2.5 2.5 0 0 1 12 8.5v5A2.5 2.5 0 0 1 9.5 16h-7A2.5 2.5 0 0 1 0 13.5v-5A2.5 2.5 0 0 1 2.5 6H8V4a4 4 0 0 1 4-4" />
        </svg>
        }
      </button>
    </div>
    <a href="/login">Ya tienes una cuenta?</a>
    <button id="register" [disabled]="loading">{{ loading ? 'Cargando...' : 'REGISTRARME' }}</button>
  </form>
</div>
