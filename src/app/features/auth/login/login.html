<div id="cont_login">
  <div class="cont_msg">
    <div id="cont_img">
      <img src="/banners/Logo_Hermes.png" alt="">
      <h1>ermes</h1>
    </div>
    <p>Sigue explorando comunidades que tengan tus mismos gustos.</p>
  </div>
  <form action="" (ngSubmit)="onSumbit()">
    <h1>INGRESA</h1>
    <div class="cont_input">
      <input type="text" placeholder="Nombre de usuario y email" id="datauser" name="datauser" [(ngModel)]="user.dataUser">
      <div class="view_input">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill"
          viewBox="0 0 16 16">
          <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6" />
        </svg>
      </div>
    </div>
    <div class="cont_input">
      <input type="{{typeLocked}}" placeholder="Contraseña" id="password" name="password" [(ngModel)]="user.dataPassword">
      <button class="view_input" (click)="miFuncion($event)" type="submit">
        @if (isLocked) {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock-fill"
          viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3" />
        </svg>
        }@else {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-unlock-fill"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
              d="M12 0a4 4 0 0 1 4 4v2.5h-1V4a3 3 0 1 0-6 0v2h.5A2.5 2.5 0 0 1 12 8.5v5A2.5 2.5 0 0 1 9.5 16h-7A2.5 2.5 0 0 1 0 13.5v-5A2.5 2.5 0 0 1 2.5 6H8V4a4 4 0 0 1 4-4" />
          </svg>
        }
      </button>
    </div>
    <a href="/register">No tienes una cuenta?</a>
    <button id="login" [disabled]="isLoading">
      {{ isLoading ? 'Cargando...' : 'Ingresar' }}
    </button>
  </form>
</div>
