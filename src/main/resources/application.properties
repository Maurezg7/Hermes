package maurezg7.backend.config;

import java.util.Arrays;
import org.springframework.context.annotation.Bean;
import org.springframework.context.annotation.Configuration; // 1. IMPORTANTE: Añadir este import
import org.springframework.web.cors.CorsConfiguration;
import org.springframework.web.cors.UrlBasedCorsConfigurationSource;
import org.springframework.web.filter.CorsFilter;

@Configuration // 2. IMPORTANTE: Añadir esta anotación para que Spring Boot detecte el Bean
public class CorsConfig {
        @Bean
        public CorsFilter corsFilter() {
                CorsConfiguration corsConfiguration = new CorsConfiguration();
                corsConfiguration.setAllowCredentials(true);

                // 3. Añadir la URL de producción de tu Vercel aquí (sin la barra '/' al final)
                corsConfiguration.setAllowedOrigins(Arrays.asList(
                                "http://localhost:4200",
                                "http://localhost:8080",
                                "https://vercel.app")); 

                corsConfiguration.setAllowedHeaders(Arrays.asList(
                                "Origin", "Access-Control-Allow-Origin", "Content-Type",
                                "Accept", "Authorization", "X-Requested-With",
                                "Access-Control-Request-Method", "Access-Control-Request-Headers"));

                corsConfiguration.setAllowedMethods(Arrays.asList(
                                "GET", "POST", "PUT", "DELETE", "OPTIONS"));

                corsConfiguration.setExposedHeaders(Arrays.asList(
                                "Origin", "Content-Type", "Accept", "Authorization",
                                "Access-Control-Allow-Origin", "Access-Control-Allow-Credentials"));

                corsConfiguration.setMaxAge(3600L);

                UrlBasedCorsConfigurationSource source = new UrlBasedCorsConfigurationSource();
                source.registerCorsConfiguration("/**", corsConfiguration);

                return new CorsFilter(source);
        }
}
